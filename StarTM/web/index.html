<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轨道星座 · 第一人称观测终端</title>
    <link rel="icon" href="data:,">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 顶部状态栏 -->
    <header id="top-bar">
        <div class="brand">
            <span class="logo-mark">◉</span>
            <span class="brand-text">轨道星座观测终端</span>
        </div>
        <div class="status-group">
            <div class="status-item">
                <span class="status-dot" id="ws-dot"></span>
                <span class="status-label" id="ws-status">离线</span>
            </div>
            <div class="status-item data-rate">
                <span class="rate-value" id="data-rate">0</span>
                <span class="rate-unit">帧/秒</span>
            </div>
            <div class="status-item clock">
                <span id="system-clock">--:--:--</span>
            </div>
        </div>
    </header>

    <!-- 左侧控制面板 -->
    <aside id="control-panel">
        <section class="panel-section">
            <h3 class="section-title">观测视角</h3>
            <div class="view-switcher">
                <button id="thirdViewBtn" class="view-btn active" title="第三视角">
                    <span class="btn-icon">🌍</span>
                    <span class="btn-label">轨道</span>
                </button>
                <button id="firstViewBtn" class="view-btn" title="第一视角">
                    <span class="btn-icon">👁</span>
                    <span class="btn-label">地面</span>
                </button>
                <button id="centerViewBtn" class="view-btn" title="主星视角">
                    <span class="btn-icon">🛰️</span>
                    <span class="btn-label">编队</span>
                </button>
            </div>
        </section>

        <div class="panel-divider"></div>

        <section class="panel-section">
            <h3 class="section-title">地面站坐标</h3>
            <div class="coord-inputs">
                <div class="input-group">
                    <label>纬度</label>
                    <input type="number" id="lat" value="-15" step="0.1" min="-90" max="90">
                </div>
                <div class="input-group">
                    <label>经度</label>
                    <input type="number" id="lon" value="-125" step="0.1" min="-180" max="180">
                </div>
            </div>
            <button id="apply" class="action-btn">应用坐标</button>
        </section>

        <div class="panel-divider"></div>

        <section class="panel-section" id="lockViewGroup" style="display:none;">
            <button id="lockViewBtn" class="action-btn">🔒 锁定视角</button>
        </section>

        <section class="panel-section">
            <h3 class="section-title">数据源</h3>
            <div class="mode-toggle">
                <button id="modeToggle" class="mode-btn">
                    <span class="mode-icon">📡</span>
                    <span class="mode-text">WS 实时</span>
                </button>
            </div>
            <div class="file-input-wrapper">
                <label for="csvFileInput" class="file-label">
                    <span class="file-icon">📄</span>
                    <span>加载 CSV</span>
                </label>
                <input type="file" id="csvFileInput" accept=".csv" class="hidden-input">
            </div>
        </section>

        <div class="panel-divider"></div>

        <section class="panel-section">
            <h3 class="section-title">时间轴控制</h3>
            <!-- 时间范围选择器 -->
            <div class="time-range-container" id="timeRangeContainer" style="display:none;">
                <div class="time-range-row">
                    <label class="time-range-label">开始</label>
                    <select id="startIdx" class="time-range-select"></select>
                </div>
                <div class="time-range-row">
                    <label class="time-range-label">结束</label>
                    <select id="endIdx" class="time-range-select"></select>
                </div>
            </div>
            <div class="time-control">
                <div class="time-display" id="timeDisplay">--:--:--</div>
                <input type="range" id="timeSlider" min="0" max="1439" value="0" class="time-slider">
                <div class="time-bar-container">
                    <div id="time-bar"></div>
                </div>
            </div>
            <div class="playback-controls">
                <button id="playBtn" class="play-btn" title="播放">
                    <span class="play-icon">▶</span>
                </button>
                <button id="stopBtn" class="stop-btn" title="停止">
                    <span class="stop-icon">■</span>
                </button>
                <select id="speed" class="speed-select" title="播放速度（真实时间倍数）">
                    <option value="1000" selected>1×</option>
                    <option value="100">10×</option>
                    <option value="17">60×</option>
                </select>
            </div>
        </section>

        <div class="panel-divider"></div>

        <section class="panel-section">
            <h3 class="section-title">卫星统计</h3>
            <div class="sat-stats" id="info">
                <div class="stat-row">
                    <span class="stat-label">可见</span>
                    <span class="stat-value" id="visibleCount">0</span>
                    <span class="stat-sep">/</span>
                    <span class="stat-total" id="totalSatCount">0</span>
                </div>
                <button id="statsBtn" class="stats-btn">📊 详细</button>
                <div id="visibility-info" class="visibility-list"></div>
            </div>
        </section>

        <div class="panel-divider"></div>

        <section class="panel-section">
            <button id="openConstellationPanel" class="constellation-btn">
                🛰️ 编队灯光控制
            </button>
        </section>
    </aside>

    <!-- 主画布区域 -->
    <main id="canvasContainer"></main>

    <!-- 底部信息条（兼容 groundInfo ID） -->
    <footer id="info-bar">
        <div class="info-item" id="groundInfo">
            <span class="info-label">地面站</span>
            <span class="info-value" id="coordDisplay">--</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-item">
            <span class="info-label">方位角</span>
            <span class="info-value" id="azimuth-display">--</span>
        </div>
        <div class="info-divider"></div>
        <div class="info-item">
            <span class="info-label">仰角</span>
            <span class="info-value" id="elevation-display">--</span>
        </div>
    </footer>

    <!-- 统计面板 -->
    <div id="stats-panel" class="hidden">
        <div class="stats-header">
            <h4>📊 详细统计</h4>
            <button id="closeStatsBtn">✕</button>
        </div>
        <div id="stats-content"></div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- 加载状态覆盖层 -->
    <div id="loading-overlay" style="
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: #0a0a1e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        color: #4488ff;
        font-family: 'Share Tech Mono', monospace;
    ">
        <div style="font-size: 24px; margin-bottom: 20px;">◉ 轨道星座观测终端</div>
        <div id="loading-status" style="font-size: 14px; color: #888;">正在初始化系统...</div>
        <div id="loading-retry" style="font-size: 12px; color: #666; margin-top: 10px; display: none;"></div>
    </div>

    <!-- 模块加载错误检测与自动重试 -->
    <script>
    (function() {
        let retryCount = 0;
        const maxRetries = 3;
        let loadErrorDetected = false;
        let appReady = false;

        function updateStatus(msg, isError) {
            const status = document.getElementById('loading-status');
            const retry = document.getElementById('loading-retry');
            if (status) {
                status.textContent = msg;
                status.style.color = isError ? '#ff4444' : '#888';
            }
            if (retry && retryCount > 0) {
                retry.style.display = 'block';
                retry.textContent = `重试次数: ${retryCount}/${maxRetries}`;
            }
        }

        function hideOverlay() {
            if (appReady) return; // 已隐藏过
            appReady = true;
            const overlay = document.getElementById('loading-overlay');
            if (overlay) {
                overlay.style.transition = 'opacity 0.5s';
                overlay.style.opacity = '0';
                setTimeout(() => overlay.remove(), 500);
            }
        }

        function autoReload() {
            if (appReady) return; // 应用已就绪，不重试
            retryCount++;
            if (retryCount > maxRetries) {
                updateStatus('加载失败，请检查网络连接后手动刷新页面', true);
                const retry = document.getElementById('loading-retry');
                if (retry) {
                    retry.innerHTML = '<button onclick="location.reload()" style="background:#2a4a6a;border:1px solid #4488ff;color:#fff;padding:5px 15px;border-radius:3px;cursor:pointer;margin-top:10px;">手动刷新</button>';
                }
                return;
            }

            updateStatus(`模块加载失败，${2 ** retryCount}秒后自动重试...`, true);
            setTimeout(() => {
                if (!appReady) location.reload();
            }, (2 ** retryCount) * 1000);
        }

        // 检测全局错误
        window.onerror = function(msg, url, line, col, error) {
            const errorStr = String(msg);
            if (errorStr.includes('import') || errorStr.includes('module') || errorStr.includes('ERR_CONNECTION')) {
                loadErrorDetected = true;
                autoReload();
                return true;
            }
            return false;
        };

        // 检测未捕获的 Promise 错误（import() 失败）
        window.addEventListener('unhandledrejection', function(e) {
            const errorStr = String(e.reason);
            if (errorStr.includes('import') || errorStr.includes('module') || errorStr.includes('ERR_CONNECTION') || errorStr.includes('Failed to fetch')) {
                loadErrorDetected = true;
                e.preventDefault();
                autoReload();
            }
        });

        // 检测 Canvas 创建（应用成功初始化的标志）
        const observer = new MutationObserver(function(mutations) {
            if (appReady) return;
            const canvas = document.querySelector('#canvasContainer canvas');
            if (canvas) {
                updateStatus('系统初始化完成');
                hideOverlay();
                observer.disconnect();
            }
        });
        observer.observe(document.body, { childList: true, subtree: true });

        // 备用：30秒超时（只有未检测到 Canvas 且未出错时才重试）
        setTimeout(function() {
            if (!appReady && !loadErrorDetected) {
                updateStatus('系统初始化超时，正在重试...', true);
                autoReload();
            }
        }, 30000);

        // 页面 load 事件后备
        window.addEventListener('load', function() {
            setTimeout(function() {
                const canvas = document.querySelector('#canvasContainer canvas');
                if (canvas && !appReady) {
                    hideOverlay();
                }
            }, 2000);
        });
    })();
    </script>

    <script type="module" src="app.js"></script>
</body>
</html>
