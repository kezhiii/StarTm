<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>天幕卫星 V0 · 飞行模拟仿真系统</title>
<style>
  :root {
    color-scheme: dark;
    --ink:   #04080d;
    --panel-a: rgba(11, 19, 28, .88);
    --panel-b: rgba(6, 11, 18, .82);
    --line:  #16232f;
    --line-hot: #2e4a5f;
    --txt:   #c3d4e2;
    --label: #8ba0b4;
    --dim:   #5c7288;
    --data:  #7fe3d6;
    --data-2:#7ba6e8;
    --alert: #e8a33d;
    --bad:   #d8604b;
    --num: "Bahnschrift SemiCondensed", "Bahnschrift", Consolas, "Segoe UI", monospace;
    --cn: "HarmonyOS Sans SC", "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink);
               font: 12px/1.5 var(--cn); color: var(--txt); }

  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; background: #000; }
  /* 画面四周压暗，使浮层读数不被高亮地球淹没 */
  #vignette { position: fixed; inset: 0; pointer-events: none;
              background: radial-gradient(125% 95% at 50% 42%, transparent 52%, rgba(3, 7, 12, .62) 100%); }

  .panel { position: fixed; background: linear-gradient(180deg, var(--panel-a), var(--panel-b));
           border: 1px solid var(--line); border-radius: 2px;
           box-shadow: 0 8px 28px rgba(0, 0, 0, .5); }
  /* 角标：控制台观感，只在对角两段加亮线 */
  .panel::before, .panel::after { content: ''; position: absolute; width: 11px; height: 11px; pointer-events: none; }
  .panel::before { top: -1px; left: -1px; border-top: 1px solid var(--line-hot); border-left: 1px solid var(--line-hot); }
  .panel::after { bottom: -1px; right: -1px; border-bottom: 1px solid var(--line-hot); border-right: 1px solid var(--line-hot); }

  .p-head { display: flex; align-items: center; gap: 8px; padding: 8px 11px; border-bottom: 1px solid var(--line); }
  .p-head .tick { width: 2px; height: 12px; background: var(--data); }
  .p-head.amber .tick { background: var(--alert); }
  .p-head h2 { font: 600 12px/1 var(--cn); letter-spacing: .05em; color: #a2bad0; }
  .p-head .meta { margin-left: auto; font: 11px var(--num); color: var(--dim); }

  /* ── 左栏：任务时钟 ─────────────────────────────── */
  #railLeft { top: 14px; left: 14px; width: 258px; }
  #railLeft .ident { padding: 11px 11px 9px; }
  #railLeft .ident b { display: block; font: 600 15px/1.25 var(--cn); color: #dbe8f4; letter-spacing: .02em; }
  #railLeft .ident span { display: block; margin-top: 3px; font-size: 11px; color: var(--dim); }
  .clock { padding: 10px 11px 12px; border-top: 1px solid var(--line); }
  #tplus { font: 300 33px/1 var(--num); letter-spacing: .04em; color: #eaf3fa; font-variant-numeric: tabular-nums; }
  #tplus .pre { font-size: 14px; color: var(--dim); margin-right: 5px; letter-spacing: .1em; }
  #utcg { margin-top: 5px; font: 12px var(--num); color: var(--label); letter-spacing: .02em; }
  #status { display: flex; align-items: center; gap: 6px; margin-top: 9px; font-size: 11px; color: var(--dim); }
  #status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
  #status.live .dot { background: var(--data); box-shadow: 0 0 7px var(--data); }
  #status.err .dot { background: var(--bad); }

  .kvlist { padding: 3px 11px 11px; }
  .kv { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; font-size: 11px; color: var(--dim); }
  .kv b { font: 11.5px var(--num); font-weight: 500; color: var(--label); text-align: right;
          font-variant-numeric: tabular-nums; }
  .btn { font: 12px var(--cn); padding: 7px 12px; color: var(--txt); background: rgba(30, 52, 71, .55);
         border: 1px solid var(--line-hot); border-radius: 2px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: rgba(43, 74, 100, .7); color: #eaf3fa; }
  .btn.primary { border-color: rgba(127, 227, 214, .5); color: var(--data); }
  .btn.primary:hover { background: rgba(127, 227, 214, .12); }
  .btn.on { background: rgba(127, 227, 214, .14); border-color: var(--data); color: var(--data); }
  .btn:focus-visible, .seg button:focus-visible, input:focus-visible, a.ghost:focus-visible {
    outline: 1px solid var(--data-2); outline-offset: 1px; }
  #btnAttach { width: 100%; margin: 2px 0 10px; }
  .attach { padding: 0 11px; }

  /* ── 左栏底部：弹出终端入口 ─────────────────────── */
  .railfoot { padding: 9px 11px; border-top: 1px solid var(--line); }
  a.ghost { display: inline-flex; align-items: center; gap: 6px; font-size: 11px;
            color: var(--label); text-decoration: none; }
  a.ghost::before { content: ''; width: 5px; height: 5px; background: var(--alert); }
  a.ghost:hover { color: var(--data); }

  /* ── 右栏：参数台 ───────────────────────────────── */
  #console { top: 14px; right: 14px; bottom: 104px; width: 386px; display: flex; flex-direction: column;
             backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  #console .body { flex: 1; overflow-y: auto; padding: 11px; scrollbar-width: thin;
                   scrollbar-color: var(--line-hot) transparent; }
  #console .body::-webkit-scrollbar { width: 7px; }
  #console .body::-webkit-scrollbar-thumb { background: var(--line-hot); }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
  .seg button { flex: 1; padding: 6px 4px; font: 12px var(--num); letter-spacing: .04em; color: var(--label);
                background: transparent; border: 0; border-left: 1px solid var(--line); cursor: pointer; }
  .seg button:first-child { border-left: 0; }
  .seg button:hover { color: #eaf3fa; background: rgba(43, 74, 100, .4); }
  .seg button.on { color: var(--data); background: rgba(127, 227, 214, .1); box-shadow: inset 0 -2px 0 var(--data); }
  .sec { margin: 14px 0 7px; font: 600 11px var(--cn); letter-spacing: .05em; color: #93aabf; }
  .sec:first-child { margin-top: 0; }
  .sec .hint { float: right; font: 10px var(--num); color: var(--dim); letter-spacing: 0; }

  .ptable { width: 100%; border-collapse: collapse; }
  .ptable td { padding: 2px 0; }
  .ptable td.name { color: var(--label); font-size: 11px; }
  .ptable td.val { text-align: right; font: 13px/1.5 var(--num); color: var(--data);
                   font-variant-numeric: tabular-nums; white-space: nowrap; }
  .ptable td.unit { text-align: left; width: 52px; padding-left: 7px; color: var(--dim); font-size: 10px; }
  .ptable tr.group td { padding: 9px 0 4px; color: #9fb6cc; font-size: 11px; letter-spacing: .04em;
                        border-bottom: 1px solid var(--line); }
  .ptable tr.group:first-child td { padding-top: 0; }
  .st-empty { color: var(--dim) !important; }
  .st-lag { color: var(--alert); font-size: 10px; }
  .placeholder { padding: 26px 8px; text-align: center; color: var(--dim); font-size: 11px; }

  .metric { margin-bottom: 12px; border: 1px solid var(--line); border-radius: 2px; background: rgba(6, 11, 18, .5); }
  .m-head { display: flex; align-items: baseline; gap: 8px; padding: 6px 8px 4px; }
  .m-head .m-name { color: var(--label); font-size: 11px; }
  .m-head .m-vals { margin-left: auto; display: flex; gap: 9px; }
  .m-head .m-v { font: 13px var(--num); color: var(--data); font-variant-numeric: tabular-nums; }
  .m-head .m-v i { display: inline-block; width: 5px; height: 5px; margin-right: 4px; border-radius: 1px; }
  .m-head .m-unit { font-size: 10px; color: var(--dim); }
  .metric canvas { display: block; width: 100%; height: 72px; }

  /* ── 底部走带 ───────────────────────────────────── */
  #transport { left: 286px; right: 414px; bottom: 14px; height: 76px; }
  #transport .bar { display: flex; align-items: center; gap: 8px; padding: 8px 11px 2px; }
  #transport .icon { width: 30px; padding: 5px 0; text-align: center; font: 12px var(--num); }
  #transport .legend { margin-left: auto; display: flex; gap: 12px; font-size: 10px; color: var(--dim); }
  #transport .legend i { display: inline-block; width: 14px; height: 3px; margin-right: 4px; vertical-align: middle; }
  .tl { position: relative; height: 26px; margin: 0 11px 6px; }
  .tl .rail { position: absolute; left: 0; right: 0; top: 15px; height: 3px; background: rgba(36, 56, 74, .8); }
  .tl .bands { position: absolute; left: 0; right: 0; top: 3px; height: 8px; }
  .tl .band { position: absolute; top: 0; height: 100%; background: rgba(232, 163, 61, .75); }
  .tl .band.disp { top: 0; background: rgba(127, 227, 214, .6); }
  .tl .ticks { position: absolute; left: 0; right: 0; top: 19px; height: 7px;
               border-left: 1px solid var(--line-hot); }
  .tl .tick { position: absolute; top: 0; width: 1px; height: 4px; background: var(--line-hot); }
  .tl .ticklab { position: absolute; top: 4px; font: 9px var(--num); color: var(--dim); transform: translateX(-50%); }
  #stepSlider { position: absolute; inset: 0; width: 100%; height: 26px; margin: 0;
                -webkit-appearance: none; appearance: none; background: transparent; cursor: ew-resize; }
  #stepSlider::-webkit-slider-thumb { -webkit-appearance: none; width: 2px; height: 24px; background: var(--data);
                                      box-shadow: 0 0 8px rgba(127, 227, 214, .8); }
  #stepSlider::-moz-range-thumb { width: 2px; height: 24px; border: 0; border-radius: 0; background: var(--data);
                                  box-shadow: 0 0 8px rgba(127, 227, 214, .8); }
  #stepSlider::-webkit-slider-runnable-track { background: transparent; }
  #stepSlider::-moz-range-track { background: transparent; }
  .foot { padding: 0 11px 8px; font-size: 10px; color: var(--dim); }

  @media (max-width: 1180px) {
    #console { width: 320px; }
    #transport { right: 348px; }
  }
  @media (max-width: 900px) {
    #railLeft { display: none; }
    #console { top: 14px; bottom: 104px; right: 14px; width: 300px; }
    #transport { left: 14px; right: 328px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .panel { animation: rise .28s ease-out both; }
    #console { animation-delay: .06s; }
    #transport { animation-delay: .12s; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } }
  }
</style>
</head>
<body>
<iframe id="stage" src="/web/?bare=1" title="编队三维态势"></iframe>
<div id="vignette"></div>

<div class="panel" id="railLeft">
  <div class="ident">
    <b>天幕卫星 V0</b>
    <span>飞行模拟仿真系统 · 编队态势与参数回放</span>
  </div>
  <div class="clock">
    <div id="tplus"><span class="pre">T+</span>--:--:--</div>
    <div id="utcg">UTC --</div>
    <div id="status"><span class="dot"></span><span id="statusText">等待画面桥接</span></div>
  </div>
  <div class="attach"><button id="btnAttach" class="btn primary">接入数据并接管时钟</button></div>
  <div class="kvlist">
    <div class="kv"><span>数据源</span><b id="kvSrc">星历文件回放</b></div>
    <div class="kv"><span>步长</span><b id="kvInterval">--</b></div>
    <div class="kv"><span>参数版本</span><b id="kvVer">--</b></div>
    <div class="kv"><span>地面站</span><b id="kvStation">--</b></div>
    <div class="kv"><span>当前步</span><b id="kvStep">0 / 0</b></div>
  </div>
  <div class="railfoot">
    <a class="ghost" href="/web/" target="_blank" rel="noopener">打开观测终端（灯光 / 图案 / 协议）</a>
  </div>
</div>

<div class="panel" id="console">
  <div class="p-head">
    <span class="tick"></span><h2>参数台</h2>
    <span class="meta" id="kvSat">TM0S1</span>
  </div>
  <div class="body">
    <div class="seg" id="satSel" role="group" aria-label="选择卫星"></div>
    <div class="sec">参数表<span class="hint">表2-1 八项分组</span></div>
    <table class="ptable"><tbody id="panelBody">
      <tr><td class="placeholder" colspan="3">接入数据后显示连续状态与任务参数</td></tr>
    </tbody></table>
    <div class="sec">构型与目标区曲线<span class="hint">当前时刻前 1 小时</span></div>
    <div id="metrics"></div>
    <div class="sec" style="margin-bottom:0">说明</div>
    <div class="kv"><span>三维画面</span><b>概略显示，判据以数据文件为准</b></div>
    <div class="kv"><span>事件</span><b>按真实时刻单点显示，不插值</b></div>
  </div>
</div>

<div class="panel" id="transport">
  <div class="bar">
    <button id="btnPlay" class="btn icon" aria-label="播放">▶</button>
    <button id="btnPause" class="btn icon" aria-label="暂停">⏸</button>
    <div class="seg" id="rate" style="width:150px" role="group" aria-label="走带倍速">
      <button data-rate="1" class="on">1×</button>
      <button data-rate="10">10×</button>
      <button data-rate="60">60×</button>
    </div>
    <div class="seg" id="viewSel" style="width:164px" role="group" aria-label="三维视角">
      <button data-view="third" class="on">全局轨道</button>
      <button data-view="center">编队近景</button>
    </div>
    <div class="legend">
      <span><i style="background:rgba(232,163,61,.75)"></i>共同可见</span>
      <span><i style="background:rgba(127,227,214,.6)"></i>显示有效</span>
    </div>
  </div>
  <div class="tl">
    <div class="bands" id="tlBands"></div>
    <div class="rail"></div>
    <div class="ticks" id="tlTicks"></div>
    <input id="stepSlider" type="range" min="0" max="0" value="0" step="1" aria-label="时间走带">
  </div>
</div>

<script type="module" src="./js/main.js?v=11"></script>
</body>
</html>
