<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>飞行模拟仿真系统 · 态势终端</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000;
               font: 13px/1.5 "Microsoft YaHei", sans-serif; color: #cfd8ea; }
  #stage { position: fixed; inset: 0; width: 100vw; height: 100vh; border: 0; background: #000; }

  .panel { position: fixed; background: rgba(10, 18, 34, 0.74);
           border: 1px solid rgba(96, 150, 214, 0.28); border-radius: 10px;
           backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45); pointer-events: auto; }

  #titlePanel { top: 10px; left: 10px; padding: 10px 14px; max-width: 300px; }
  #titlePanel h1 { font-size: 15px; color: #7fd4ff; margin-bottom: 4px; }
  #status { font-size: 11px; color: #8fa3c0; }
  #btnAttach { margin-top: 8px; width: 100%; }

  #clockPanel { top: 10px; left: 50%; transform: translateX(-50%); padding: 8px 22px;
                display: flex; align-items: center; gap: 22px; }
  #clock { font: 22px/1.2 Consolas, monospace; color: #7fd4ff; letter-spacing: 1px; }
  #clockPanel .sub { font-size: 11px; color: #8fa3c0; text-align: center; }
  #clockPanel .sub b { display: block; font: 14px Consolas, monospace; color: #cfd8ea; }

  #dataPanel { top: 64px; right: 10px; bottom: 86px; width: 330px; padding: 12px; overflow-y: auto; }
  #dataPanel h2 { font-size: 12px; color: #9fb3d1; margin: 12px 0 6px; }
  #dataPanel h2:first-child { margin-top: 0; }

  #ctrlPanel { bottom: 10px; left: 50%; transform: translateX(-50%); width: min(760px, 92vw);
               padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
  #stepSlider { flex: 1; }
  .row { display: flex; gap: 8px; margin: 6px 0; }
  button { padding: 7px 12px; background: rgba(28, 42, 71, 0.9); color: #cfd8ea;
           border: 1px solid #33456b; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  button:hover { background: #25385e; }
  button.on { background: #145a4a; border-color: #2aa198; }
  select { padding: 6px; background: rgba(28, 42, 71, 0.9); color: #cfd8ea;
           border: 1px solid #33456b; border-radius: 6px; }
  .kv { display: flex; justify-content: space-between; font-size: 11px; color: #8fa3c0; }

  .ptable { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ptable td { padding: 2px 4px; border-bottom: 1px solid rgba(34, 48, 74, 0.8); }
  .ptable tr.group td { color: #7fd4ff; font-weight: bold; padding-top: 8px;
                        border-bottom: 1px solid #33456b; }
  .ptable .unit { color: #5a6b85; text-align: right; }
  .st-empty { color: #5a6b85; }
  .st-lag { color: #e67e22; font-size: 10px; }
  .chart { width: 100%; height: 88px; display: block; margin-bottom: 8px;
           background: rgba(13, 21, 38, 0.85); border-radius: 4px; }
  a.term-link { color: #7fd4ff; text-decoration: none; font-size: 12px; }
  a.term-link:hover { text-decoration: underline; }
</style>
</head>
<body>
<iframe id="stage" src="/web/?bare=1"></iframe>

<div class="panel" id="titlePanel">
  <h1>飞行模拟仿真系统</h1>
  <div id="status">等待 StarTM 桥接…</div>
  <div class="row"><button id="btnAttach">接入外部驱动</button></div>
  <a class="term-link" href="/web/" target="_blank">原始观测终端（含灯光/图案控制）↗</a>
</div>

<div class="panel" id="clockPanel">
  <div class="sub">任务时间<b id="clock">--</b></div>
  <div class="sub">当前步<b id="kvStep">0 / 0</b></div>
  <div class="sub">步长<b id="kvInterval">-- s</b></div>
  <div class="sub">参数版本<b id="kvVer">--</b></div>
</div>

<div class="panel" id="dataPanel">
  <h2>星选择</h2>
  <div class="row" id="satSel"></div>
  <h2>参数表（表2-1 八项分组）</h2>
  <table class="ptable"><tbody id="panelBody"></tbody></table>
  <h2>构型曲线（当前时刻前 1 小时）</h2>
  <canvas id="chartEdge" class="chart"></canvas>
  <canvas id="chartCd" class="chart"></canvas>
  <canvas id="chartDrift" class="chart"></canvas>
  <h2>目标区昼夜（合肥，门限默认关）</h2>
  <canvas id="chartSun" class="chart"></canvas>
  <h2>说明</h2>
  <div class="kv"><span>三维画面</span><span>StarTM bare（唯一实例）</span></div>
  <div class="kv"><span>时钟归属</span><span>本页面</span></div>
</div>

<div class="panel" id="ctrlPanel">
  <button id="btnPlay">▶</button>
  <button id="btnPause">⏸</button>
  <select id="rate">
    <option value="1" selected>1×（一秒走一秒）</option>
    <option value="10">10×</option>
    <option value="60">60×</option>
  </select>
  <input id="stepSlider" type="range" min="0" max="0" value="0">
</div>

<script type="module" src="./js/main.js?v=5"></script>
</body>
</html>
