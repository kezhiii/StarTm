<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>卫星编队地面观测</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="controls">
        <div class="control-group view-switch">
            <button id="thirdViewBtn" class="active">🌍 第三视角</button>
            <button id="firstViewBtn">👁 第一视角</button>
            <button id="centerViewBtn">🛰️ 主星视角</button>
        </div>
        <div class="control-group" id="lockViewGroup" style="display:none;">
            <button id="lockViewBtn" class="active">🔒 锁定视角</button>
        </div>
        <hr>
        <div class="control-group">
            <label>数据文件:</label>
            <input type="file" id="csvFileInput" accept=".csv">
        </div>
        <hr>
        <div class="control-group">
            <label>纬度 (°):</label>
            <input type="number" id="lat" value="-15" step="0.1" min="-90" max="90">
        </div>
        <div class="control-group">
            <label>经度 (°):</label>
            <input type="number" id="lon" value="-125" step="0.1" min="-180" max="180">
        </div>
        <div class="control-group">
            <button id="apply">应用位置</button>
            <button id="statsBtn">📊 统计</button>
        </div>
        <hr>
        <div class="control-group">
            <label>起始时间:</label>
            <select id="startIdx"></select>
        </div>
        <div class="control-group">
            <label>结束时间:</label>
            <select id="endIdx"></select>
        </div>
        <hr>
        <div class="control-group">
            <label>时间轴:</label>
            <input type="range" id="timeSlider" min="0" max="1439" value="0">
            <span id="timeDisplay">--</span>
        </div>
        <div id="time-bar-container">
            <div id="time-bar"></div>
        </div>
        <div class="control-group">
            <button id="playBtn">▶ 播放</button>
            <button id="stopBtn">■ 停止</button>
            <label>速度:</label>
            <select id="speed">
                <option value="200" selected>1X</option>
                <option value="40">5X</option>
                <option value="20">10X</option>
                <option value="13">15X</option>
            </select>
        </div>
        <div class="control-group">
            <button id="modeToggle">🔄 切换到 CSV 模式</button>
        </div>
        <hr>
        <div class="control-group" id="lightControlGroup">
            <button id="openConstellationPanel" style="width: 100%;">🛰️ 打开编队灯光控制</button>
        </div>
        <hr>
        <div id="info">
            <div>可见卫星: <span id="visibleCount">0</span> / <span id="totalSatCount">22</span></div>
        </div>
        <div id="visibility-info"></div>
    </div>
    <div id="stats-panel" class="hidden">
        <div class="stats-header">
            <h4>📊 统计信息</h4>
            <button id="closeStatsBtn">✕</button>
        </div>
        <div id="stats-content"></div>
    </div>
    <div id="canvasContainer"></div>
    <div id="ws-status-bar">
        <span id="ws-status-dot" class="dot disconnected"></span>
        <span id="ws-status-text">未连接</span>
    </div>
    <div id="groundInfo" class="hidden">
        地面站: <span id="coordDisplay">--</span>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    <script type="module" src="app.js"></script>
</body>
</html>
